# iface-ble — RNS over the ble-reticulum v2.2 protocol.
#
# Discovers other implementations of the protocol over Bluetooth Low Energy —
# Columba on Android, ble-reticulum on Linux, another reticulous node — and
# gives each of them its own rnsd interface, so Reticulum sees a point-to-point
# link per peer rather than one shared medium.
#
# Both roles at once: the device advertises the service and scans for it, and
# which of two peers dials is decided by comparing their adapter addresses.
schema_version: 1
name: reticulous/iface-ble
prefix: rns_ble
version: 0.0.0
firmware: esp-idf
platforms: [idf]
requires:
  - reticulous/rns
  # spangap-ble owns the host, the advertising instance, the scanner, the bond
  # store and the connection budget. This straddle is a consumer of ble.h and
  # initialises no Bluetooth of its own.
  - spangap/spangap-ble

# Boot-registered service: BleIfaceService::onInit() queues the v2.2 GATT
# service with spangap-ble, registers the `ble_if` CLI verbs and registers with
# the RNS lifecycle orchestrator. The task is spawned by rnsStart(), not here.
services:
  - { class: BleIfaceService, header: ble_iface.h }

# Its own child node under the Reticulum pane, the shape iface-espnow has. The
# KEYS live in spangap-ble's s.ble.* namespace: pane path and key namespace are
# independent, and an operator should see one Bluetooth namespace.
settings:
  - at:
      - { id: reticulum }
      - { id: interfaces }
    order: 6
    rows:
      - heading: "Bluetooth"
      - caption: "RNS over Bluetooth Low Energy, speaking the ble-reticulum v2.2 protocol. Phones running Columba and Linux nodes running ble-reticulum join the mesh directly; each peer becomes its own interface."
      - switch: { label: "Enable Bluetooth mesh", key: "s.ble.rns.enable", default: 0 }
      - caption: "This switch is what turns the Bluetooth radio on for the mesh — it runs while something asks for it."
      - dropdown:
          label: "Bluetooth tx power"
          key: "s.ble.rns.txpower"
          default: 9
          options:
            - { v: 0,  l: "0 dBm" }
            - { v: 3,  l: "+3 dBm" }
            - { v: 6,  l: "+6 dBm" }
            - { v: 9,  l: "+9 dBm" }
            - { v: 12, l: "+12 dBm" }
            - { v: 15, l: "+15 dBm" }
            - { v: 18, l: "+18 dBm" }
            - { v: 20, l: "+20 dBm" }
      - integer:
          label: "Maximum peers"
          key: "s.ble.rns.max_peers"
          min: 1
          max: 4
          default: 3
      - caption: "Three leaves one Bluetooth connection for the RNode endpoint; four is the radio's ceiling with the endpoint's Bluetooth off. The protocol itself allows seven, but the ESP32-S3's internal RAM does not carry that beside Wi-Fi."
      - integer:
          label: "Signal floor (dBm)"
          key: "s.ble.rns.min_rssi"
          min: -100
          max: -50
          default: -85
      - integer:
          label: "Scan interval (s)"
          key: "s.ble.rns.scan_interval"
          min: 1
          max: 60
          default: 5
      - info:
          rows:
            - value: { label: "State", key: "ble.rns.state_text" }
            - value: { label: "Peers", key: "ble.rns.peers" }
            - value: { label: "Traffic", key: "ble.rns.traffic" }
      - advanced:
          rows:
            - dropdown:
                label: "Interface mode"
                key: "s.ble.rns.mode"
                default: "access_point"
                options:
                  - { v: "access_point", l: "Access point" }
                  - { v: "gateway",      l: "Gateway" }
                  - { v: "full",         l: "Full" }
                  - { v: "roaming",      l: "Roaming" }
                  - { v: "boundary",     l: "Boundary" }
            - integer: { label: "Community Radius", key: "s.ble.rns.community_radius", min: 0, max: 7, default: 3 }
            - caption: "Nodes within this many hops via a Bluetooth peer are yours: their announces are kept and answered for, and searches run on their behalf. The wider mesh a phone relays stays out of this node's directory and is reached on demand."
            - section: "Interface access code (IFAC)"
            - caption: "A network name + passphrase every peer on this interface must match, or traffic is dropped. Leave both blank for an open interface. One code for the whole radio — peers here are discovered, not configured."
            - text: { label: "IFAC network", key: "s.ble.rns.ifac_netname" }
            - text: { label: "IFAC passphrase", key: "s.ble.rns.ifac_netkey", secret: true }
